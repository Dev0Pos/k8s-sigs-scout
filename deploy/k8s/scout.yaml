apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8s-scout
  namespace: k8s-scout
  labels:
    app: k8s-scout
spec:
  replicas: 1
  selector:
    matchLabels:
      app: k8s-scout
  template:
    metadata:
      labels:
        app: k8s-scout
    spec:
      containers:
        - name: k8s-scout
          image: ghcr.io/dev0pos/k8s-sigs-scout:v0.9.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: LOG_FORMAT
              value: json
            - name: LOG_LEVEL
              value: info
            # Optional: create secret k8s-scout-github with key GITHUB_TOKEN
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: k8s-scout-github
                  key: GITHUB_TOKEN
                  optional: true
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: k8s-scout
  namespace: k8s-scout
  labels:
    app: k8s-scout
spec:
  type: NodePort
  selector:
    app: k8s-scout
  ports:
    - name: http
      port: 8080
      targetPort: http
      nodePort: 30808
