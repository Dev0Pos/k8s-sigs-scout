apiVersion: v1
kind: ServiceAccount
metadata:
  name: promtail
  namespace: k8s-scout
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: k8s-scout-promtail
rules:
  - apiGroups: [""]
    resources: [nodes, nodes/proxy, services, endpoints, pods]
    verbs: [get, watch, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: k8s-scout-promtail
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: k8s-scout-promtail
subjects:
  - kind: ServiceAccount
    name: promtail
    namespace: k8s-scout
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: promtail-config
  namespace: k8s-scout
data:
  config.yaml: |
    server:
      http_listen_port: 3101
      grpc_listen_port: 0
    positions:
      filename: /run/promtail/positions.yaml
    clients:
      - url: http://loki.k8s-scout.svc.cluster.local:3100/loki/api/v1/push
    target_config:
      sync_period: 15s
    scrape_configs:
      - job_name: k8s-scout
        pipeline_stages:
          - cri: {}
          - json:
              expressions:
                level: level
                msg: msg
          - labels:
              level:
        static_configs:
          - labels:
              job: k8s-scout
              app: k8s-scout
              namespace: k8s-scout
              __path__: /var/log/pods/k8s-scout_k8s-scout-*/k8s-scout/*.log
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: promtail
  namespace: k8s-scout
  labels:
    app: promtail
spec:
  selector:
    matchLabels:
      app: promtail
  template:
    metadata:
      labels:
        app: promtail
    spec:
      serviceAccountName: promtail
      containers:
        - name: promtail
          image: grafana/promtail:3.4.2
          args:
            - -config.file=/etc/promtail/config.yaml
          env:
            - name: GOMAXPROCS
              value: "1"
          volumeMounts:
            - name: config
              mountPath: /etc/promtail
            - name: run
              mountPath: /run/promtail
            - name: pods
              mountPath: /var/log/pods
              readOnly: true
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
      volumes:
        - name: config
          configMap:
            name: promtail-config
        - name: run
          emptyDir: {}
        - name: pods
          hostPath:
            path: /var/log/pods
